---
layout: default
---

<span class='anchor' id='post'></span>

{% if page.title %}
  <header>
    <h1 class="page__title">{{ page.title }}</h1>
    <p class="page__meta">{% if page.lang == 'zh' %}{{ page.date | date: "%Y年%m月%d日" }}{% else %}{{ page.date | date: "%B %d, %Y" }}{% endif %}</p>
  </header>
{% endif %}

{{ content }}
